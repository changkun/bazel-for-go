<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="f66-title" class="f66">
  <title id="f66-title">The bazel client starts, sends a command to the server and exits. The long-lived server holds the Skyframe graph in its Java heap, which a restart loses. The output base on disk, with the action cache, the execroot and the outputs, survives a restart.</title>
  <style>
    .f66 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f66 .f66-sm { font-size: 13px; opacity: 0.8; }
    .f66 .f66-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f66 .f66-head { font-weight: 600; }
    .f66 .f66-box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .f66 .f66-bz { fill: #3f9142; fill-opacity: 0.12; stroke: #3f9142; stroke-width: 1.5; }
    .f66 .f66-run { fill: #d9822b; fill-opacity: 0.15; stroke: #d9822b; stroke-width: 1.5; }
    .f66 .f66-runtext { fill: #d9822b; font-weight: 600; }
    .f66 .f66-line { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .f66 .f66-node { fill: #3f9142; fill-opacity: 0.5; }
    .f66 .f66-edge { stroke: #3f9142; stroke-width: 1.2; opacity: 0.7; }
  </style>
  <defs>
    <marker id="f66-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect class="f66-box" x="20" y="90" width="150" height="80" rx="8"/>
  <text x="95" y="122" text-anchor="middle" class="f66-mono f66-head">bazel</text>
  <text x="95" y="146" text-anchor="middle" class="f66-sm">client, exits after</text>
  <text x="95" y="164" text-anchor="middle" class="f66-sm">each command</text>

  <line class="f66-line" x1="170" y1="130" x2="214" y2="130" marker-start="url(#f66-arrow)" marker-end="url(#f66-arrow)"/>

  <!-- Server -->
  <rect class="f66-bz" x="218" y="30" width="250" height="210" rx="10"/>
  <text x="234" y="56" class="f66-head">server (Java, long-lived)</text>
  <rect class="f66-box" x="234" y="70" width="218" height="120" rx="8"/>
  <text x="248" y="92">heap: Skyframe graph</text>
  <g class="f66-edge">
    <line x1="290" y1="112" x2="320" y2="134"/>
    <line x1="350" y1="112" x2="320" y2="134"/>
    <line x1="350" y1="112" x2="380" y2="134"/>
    <line x1="410" y1="112" x2="380" y2="134"/>
    <line x1="320" y1="134" x2="305" y2="158"/>
    <line x1="320" y1="134" x2="350" y2="158"/>
    <line x1="380" y1="134" x2="350" y2="158"/>
    <line x1="380" y1="134" x2="400" y2="158"/>
  </g>
  <g class="f66-node">
    <circle cx="290" cy="112" r="5"/><circle cx="350" cy="112" r="5"/><circle cx="410" cy="112" r="5"/>
    <circle cx="320" cy="134" r="5"/><circle cx="380" cy="134" r="5"/>
    <circle cx="305" cy="158" r="5"/><circle cx="350" cy="158" r="5"/><circle cx="400" cy="158" r="5"/>
  </g>
  <text x="248" y="182" class="f66-sm">grows with the build graph</text>
  <rect class="f66-run" x="234" y="202" width="218" height="28" rx="6"/>
  <text x="343" y="221" text-anchor="middle" class="f66-runtext">lost on restart</text>

  <line class="f66-line" x1="468" y1="130" x2="512" y2="130" marker-end="url(#f66-arrow)"/>

  <!-- Output base -->
  <rect class="f66-box" x="516" y="30" width="184" height="210" rx="10"/>
  <text x="532" y="56" class="f66-head">output base (disk)</text>
  <text x="532" y="88" class="f66-mono">action_cache/</text>
  <text x="532" y="112" class="f66-mono">execroot/_main/</text>
  <text x="546" y="136" class="f66-mono">bazel-out/</text>
  <text x="532" y="160" class="f66-mono">external/</text>
  <text x="532" y="221" class="f66-sm">kept on restart</text>

  <text x="218" y="276" class="f66-sm">after a restart: load and analyze everything again</text>
</svg>
