<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="f91-title" class="f91">
  <title id="f91-title">The critical path of two Bazel builds of 1,000 packages, drawn to one time scale. Cold build, 30.4 seconds: building rules_go's builder 14.1 s, the standard library for tools 9.5 s, the code generator 2.0 s, thirteen compiles 2.4 s and one link 2.3 s. The first two, 23.6 s, are rules_go's own setup and the same on every machine of the same platform. After an edit to a function body in core, 3.3 seconds: one compile of 0.1 s, then one link of 3.2 s.</title>
  <style>
    .f91 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f91 .f91-sm { font-size: 13px; opacity: 0.8; }
    .f91 .f91-head { font-weight: 600; }
    .f91 .f91-run { fill: #d9822b; fill-opacity: 0.18; stroke: #d9822b; stroke-width: 1.5; }
    .f91 .f91-slice { fill: none; stroke: #d9822b; stroke-width: 1; }
    .f91 .f91-rm { fill: none; stroke: #7e57c2; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .f91 .f91-rmtext { fill: #7e57c2; font-size: 13px; }
    .f91 .f91-lead { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.5; }
    .f91 .f91-axis { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.6; }
    /* The static state is the end state. One 9 s loop: the cold path's steps appear in the
       order they ran, then the edit's, then a pause. */
    .f91 .f91-a1 { animation: f91-k1 9s linear infinite; }
    .f91 .f91-a2 { animation: f91-k2 9s linear infinite; }
    .f91 .f91-a3 { animation: f91-k3 9s linear infinite; }
    .f91 .f91-a4 { animation: f91-k4 9s linear infinite; }
    .f91 .f91-a5 { animation: f91-k5 9s linear infinite; }
    .f91 .f91-a6 { animation: f91-k6 9s linear infinite; }
    .f91 .f91-a7 { animation: f91-k7 9s linear infinite; }
    .f91 .f91-a8 { animation: f91-k8 9s linear infinite; }
    @keyframes f91-k1 { 0%, 3% { opacity: 0; } 7%, 100% { opacity: 1; } }
    @keyframes f91-k2 { 0%, 13% { opacity: 0; } 17%, 100% { opacity: 1; } }
    @keyframes f91-k3 { 0%, 23% { opacity: 0; } 27%, 100% { opacity: 1; } }
    @keyframes f91-k4 { 0%, 29% { opacity: 0; } 33%, 100% { opacity: 1; } }
    @keyframes f91-k5 { 0%, 35% { opacity: 0; } 39%, 100% { opacity: 1; } }
    @keyframes f91-k6 { 0%, 45% { opacity: 0; } 49%, 100% { opacity: 1; } }
    @keyframes f91-k7 { 0%, 57% { opacity: 0; } 61%, 100% { opacity: 1; } }
    @keyframes f91-k8 { 0%, 63% { opacity: 0; } 67%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Cold build -->
  <text x="56" y="22"><tspan class="f91-head">Cold build</tspan><tspan class="f91-sm" dx="8">critical path 29.9 s</tspan></text>

  <g class="f91-a6">
    <path class="f91-rm" d="M57,58 L57,46 L539.2,46 L539.2,58"/>
    <text x="298.1" y="38" text-anchor="middle" class="f91-rmtext">rules_go's setup, 24.2 s: the same on every machine of the same platform</text>
  </g>

  <g class="f91-a1">
    <rect class="f91-run" x="56" y="58" width="251.4" height="38" rx="4"/>
    <text x="181.7" y="74" text-anchor="middle">build rules_go's builder</text>
    <text x="181.7" y="90" text-anchor="middle" class="f91-sm">12.6 s</text>
  </g>
  <g class="f91-a2">
    <rect class="f91-run" x="307.4" y="58" width="232.8" height="38" rx="4"/>
    <text x="423.8" y="74" text-anchor="middle">standard library, tools</text>
    <text x="423.8" y="90" text-anchor="middle" class="f91-sm">11.6 s</text>
  </g>
  <g class="f91-a3">
    <rect class="f91-run" x="540.2" y="58" width="25.4" height="38" rx="4"/>
    <line class="f91-lead" x1="552.9" y1="96" x2="552.9" y2="112"/>
    <text x="548.9" y="126" text-anchor="end" class="f91-sm">code generator 1.3 s</text>
  </g>
  <g class="f91-a4">
    <rect class="f91-run" x="565.6" y="58" width="40.4" height="38" rx="2"/>
    <g class="f91-slice">
      <line x1="568.8" y1="58" x2="568.8" y2="96"/>
      <line x1="571.8" y1="58" x2="571.8" y2="96"/>
      <line x1="574.8" y1="58" x2="574.8" y2="96"/>
      <line x1="577.8" y1="58" x2="577.8" y2="96"/>
      <line x1="581.4" y1="58" x2="581.4" y2="96"/>
      <line x1="584.6" y1="58" x2="584.6" y2="96"/>
      <line x1="588" y1="58" x2="588" y2="96"/>
      <line x1="591" y1="58" x2="591" y2="96"/>
      <line x1="594" y1="58" x2="594" y2="96"/>
      <line x1="598.4" y1="58" x2="598.4" y2="96"/>
      <line x1="601.4" y1="58" x2="601.4" y2="96"/>
      <line x1="604.2" y1="58" x2="604.2" y2="96"/>
    </g>
    <line class="f91-lead" x1="585.8" y1="96" x2="585.8" y2="132"/>
    <text x="581.8" y="146" text-anchor="end" class="f91-sm">13 compiles 2.0 s</text>
  </g>
  <g class="f91-a5">
    <rect class="f91-run" x="606" y="58" width="48" height="38" rx="4"/>
    <line class="f91-lead" x1="630" y1="96" x2="630" y2="152"/>
    <text x="626" y="166" text-anchor="end" class="f91-sm">link 2.4 s</text>
  </g>

  <!-- After an edit -->
  <text x="56" y="196" class="f91-a7"><tspan class="f91-head">After an edit to a function body in core</tspan><tspan class="f91-sm" dx="8">critical path 2.3 s</tspan></text>
  <g class="f91-a7">
    <rect class="f91-run" x="56" y="208" width="3" height="38" rx="1"/>
  </g>
  <g class="f91-a8">
    <rect class="f91-run" x="59" y="208" width="45.2" height="38" rx="4"/>
    <text x="116.2" y="224">compile core 0.05 s, then one link 2.26 s</text>
    <text x="116.2" y="240" class="f91-sm">core's importers hit the action cache</text>
  </g>

  <!-- Time axis, shared by both rows -->
  <line class="f91-axis" x1="56" y1="264" x2="664" y2="264"/>
  <g class="f91-axis">
    <line x1="56" y1="264" x2="56" y2="270"/>
    <line x1="156" y1="264" x2="156" y2="268"/>
    <line x1="256" y1="264" x2="256" y2="270"/>
    <line x1="356" y1="264" x2="356" y2="268"/>
    <line x1="456" y1="264" x2="456" y2="270"/>
    <line x1="556" y1="264" x2="556" y2="268"/>
    <line x1="656" y1="264" x2="656" y2="270"/>
  </g>
  <g class="f91-sm">
    <text x="56" y="286" text-anchor="middle">0 s</text>
    <text x="256" y="286" text-anchor="middle">10 s</text>
    <text x="456" y="286" text-anchor="middle">20 s</text>
    <text x="656" y="286" text-anchor="middle">30 s</text>
  </g>
</svg>
