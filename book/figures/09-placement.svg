<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-labelledby="f93-title" class="f93">
  <title id="f93-title">Machine placement. The Bazel server stays on the machine that runs bazel and needs memory for the graph. It sends compiles, GoCompilePkg, to a pool of many small machines, chosen by the execution platform's properties. Links, GoLink, go to a few large-memory machines through the go_link exec group. Test runs, TestRunner, go to machines sized per test through the test exec group.</title>
  <style>
    .f93 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f93 .f93-sm { font-size: 13px; opacity: 0.8; }
    .f93 .f93-head { font-weight: 600; }
    .f93 .f93-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f93 .f93-bz { fill: #43A047; fill-opacity: 0.12; stroke: #43A047; stroke-width: 1.5; }
    .f93 .f93-bztext { fill: #388E3C; font-weight: 600; }
    .f93 .f93-pool { fill: #7e57c2; fill-opacity: 0.06; stroke: #7e57c2; stroke-width: 1.5; }
    .f93 .f93-pooltext { fill: #7e57c2; }
    .f93 .f93-box { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.55; }
    .f93 .f93-run { fill: #d9822b; fill-opacity: 0.18; stroke: #d9822b; stroke-width: 1.5; }
    .f93 .f93-line { fill: none; stroke: currentColor; stroke-width: 1.4; }
    /* The static state is the end state. One 9 s loop: compiles spread over the compile
       pool, then links and test runs reach theirs, then a pause. */
    .f93 .f93-s1 { animation: f93-k1 9s linear infinite; }
    .f93 .f93-s2 { animation: f93-k2 9s linear infinite; }
    .f93 .f93-s3 { animation: f93-k3 9s linear infinite; }
    .f93 .f93-s4 { animation: f93-k4 9s linear infinite; }
    .f93 .f93-s5 { animation: f93-k5 9s linear infinite; }
    .f93 .f93-s6 { animation: f93-k6 9s linear infinite; }
    .f93 .f93-s7 { animation: f93-k7 9s linear infinite; }
    @keyframes f93-k1 { 0%, 3% { opacity: 0; } 6%, 100% { opacity: 1; } }
    @keyframes f93-k2 { 0%, 8% { opacity: 0; } 11%, 100% { opacity: 1; } }
    @keyframes f93-k3 { 0%, 13% { opacity: 0; } 16%, 100% { opacity: 1; } }
    @keyframes f93-k4 { 0%, 24% { opacity: 0; } 28%, 100% { opacity: 1; } }
    @keyframes f93-k5 { 0%, 31% { opacity: 0; } 35%, 100% { opacity: 1; } }
    @keyframes f93-k6 { 0%, 42% { opacity: 0; } 46%, 100% { opacity: 1; } }
    @keyframes f93-k7 { 0%, 49% { opacity: 0; } 53%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="f93-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- The machine that runs bazel -->
  <rect class="f93-bz" x="16" y="150" width="180" height="108" rx="8"/>
  <text x="106" y="176" text-anchor="middle" class="f93-sm">machine running bazel</text>
  <text x="106" y="202" text-anchor="middle" class="f93-bztext">Bazel server</text>
  <text x="106" y="224" text-anchor="middle" class="f93-sm">memory for the graph,</text>
  <text x="106" y="242" text-anchor="middle" class="f93-sm">kept warm</text>

  <!-- Compile pool -->
  <rect class="f93-pool" x="300" y="12" width="404" height="120" rx="10"/>
  <text x="316" y="36"><tspan class="f93-head">compiles</tspan><tspan class="f93-mono" dx="8">GoCompilePkg</tspan></text>
  <text x="692" y="36" text-anchor="end" class="f93-sm f93-pooltext">platform's properties</text>
  <text x="316" y="56" class="f93-sm">many small machines: cores, modest memory</text>
  <g>
    <rect class="f93-box" x="316" y="70" width="44" height="48" rx="5"/>
    <rect class="f93-box" x="370" y="70" width="44" height="48" rx="5"/>
    <rect class="f93-box" x="424" y="70" width="44" height="48" rx="5"/>
    <rect class="f93-box" x="478" y="70" width="44" height="48" rx="5"/>
    <rect class="f93-box" x="532" y="70" width="44" height="48" rx="5"/>
    <rect class="f93-box" x="586" y="70" width="44" height="48" rx="5"/>
    <rect class="f93-box" x="640" y="70" width="44" height="48" rx="5"/>
  </g>
  <g class="f93-s2">
    <rect class="f93-run" x="324" y="84" width="28" height="20" rx="3"/>
    <rect class="f93-run" x="378" y="84" width="28" height="20" rx="3"/>
    <rect class="f93-run" x="432" y="84" width="28" height="20" rx="3"/>
  </g>
  <g class="f93-s3">
    <rect class="f93-run" x="486" y="84" width="28" height="20" rx="3"/>
    <rect class="f93-run" x="540" y="84" width="28" height="20" rx="3"/>
    <rect class="f93-run" x="594" y="84" width="28" height="20" rx="3"/>
    <rect class="f93-run" x="648" y="84" width="28" height="20" rx="3"/>
  </g>

  <!-- Link pool -->
  <rect class="f93-pool" x="300" y="146" width="404" height="120" rx="10"/>
  <text x="316" y="170"><tspan class="f93-head">links</tspan><tspan class="f93-mono" dx="8">GoLink</tspan></text>
  <text x="692" y="170" text-anchor="end" class="f93-mono f93-pooltext">go_link.&lt;name&gt;</text>
  <text x="316" y="190" class="f93-sm">a few machines: memory and fast cores</text>
  <rect class="f93-box" x="316" y="202" width="176" height="52" rx="5"/>
  <rect class="f93-box" x="508" y="202" width="176" height="52" rx="5"/>
  <g class="f93-s4">
    <rect class="f93-run" x="336" y="214" width="136" height="28" rx="4"/>
  </g>
  <g class="f93-s5">
    <rect class="f93-run" x="528" y="214" width="136" height="28" rx="4"/>
  </g>

  <!-- Test pool -->
  <rect class="f93-pool" x="300" y="280" width="404" height="120" rx="10"/>
  <text x="316" y="304"><tspan class="f93-head">test runs</tspan><tspan class="f93-mono" dx="8">TestRunner</tspan></text>
  <text x="692" y="304" text-anchor="end" class="f93-mono f93-pooltext">test.&lt;name&gt;</text>
  <text x="316" y="324" class="f93-sm">sized per test, with a time limit</text>
  <rect class="f93-box" x="316" y="336" width="86" height="52" rx="5"/>
  <rect class="f93-box" x="412" y="336" width="86" height="52" rx="5"/>
  <rect class="f93-box" x="508" y="336" width="86" height="52" rx="5"/>
  <rect class="f93-box" x="604" y="336" width="86" height="52" rx="5"/>
  <g class="f93-s6">
    <rect class="f93-run" x="330" y="350" width="58" height="24" rx="4"/>
    <rect class="f93-run" x="426" y="350" width="58" height="24" rx="4"/>
  </g>
  <g class="f93-s7">
    <rect class="f93-run" x="522" y="350" width="58" height="24" rx="4"/>
    <rect class="f93-run" x="618" y="350" width="58" height="24" rx="4"/>
  </g>

  <!-- Routes -->
  <line class="f93-line f93-s1" x1="196" y1="172" x2="296" y2="76" marker-end="url(#f93-arrow)"/>
  <line class="f93-line f93-s4" x1="196" y1="204" x2="296" y2="206" marker-end="url(#f93-arrow)"/>
  <line class="f93-line f93-s6" x1="196" y1="236" x2="296" y2="336" marker-end="url(#f93-arrow)"/>
</svg>
