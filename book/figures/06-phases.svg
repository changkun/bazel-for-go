<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="f62-title" class="f62">
  <title id="f62-title">A timeline of bazel build on the minimal example. BUILD files load, then the top-level targets greet, hello and greet_test are analyzed. The compile of greet starts as soon as greet is analyzed, while greet_test is still being analyzed.</title>
  <style>
    .f62 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f62 .f62-sm { font-size: 13px; }
    .f62 .f62-note { font-size: 13px; opacity: 0.8; }
    .f62 .f62-head { font-weight: 600; }
    .f62 .f62-bz { fill: #3f9142; fill-opacity: 0.16; stroke: #3f9142; stroke-width: 1.3; }
    .f62 .f62-run { fill: #d9822b; fill-opacity: 0.18; stroke: #d9822b; stroke-width: 1.3; }
    .f62 .f62-sep { stroke: currentColor; stroke-width: 1; opacity: 0.2; }
    .f62 .f62-band { fill: currentColor; fill-opacity: 0.07; stroke: none; }
    .f62 .f62-axis { stroke: currentColor; stroke-width: 1.3; fill: none; }
    .f62 .f62-cursor { stroke: #d9822b; stroke-width: 2; opacity: 0; }

    /* The static state is the end state: every bar shown, cursor hidden. One 9 s loop. */
    .f62 .f62-wipe { transform-box: fill-box; transform-origin: 0 0; animation: f62-wipe 9s linear infinite; }
    .f62 .f62-cursor { animation: f62-cursor 9s linear infinite; }
    .f62 .f62-end { animation: f62-end 9s linear infinite; }
    @keyframes f62-wipe { 0% { transform: scaleX(0); } 72%, 100% { transform: scaleX(1); } }
    @keyframes f62-cursor { 0% { transform: translateX(0); opacity: 1; } 72% { transform: translateX(610px); opacity: 1; } 76%, 100% { transform: translateX(610px); opacity: 0; } }
    @keyframes f62-end { 0%, 70% { opacity: 0; } 76%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="f62-reveal">
      <rect class="f62-wipe" x="100" y="0" width="610" height="320"/>
    </clipPath>
    <marker id="f62-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <text x="20" y="67" class="f62-head">Load</text>
  <text x="20" y="141" class="f62-head">Analyze</text>
  <text x="20" y="233" class="f62-head">Execute</text>
  <line class="f62-sep" x1="20" y1="86" x2="700" y2="86"/>
  <line class="f62-sep" x1="20" y1="188" x2="700" y2="188"/>

  <rect class="f62-band f62-end" x="300" y="94" width="170" height="166"/>

  <g clip-path="url(#f62-reveal)">
    <!-- Loading -->
    <rect class="f62-bz" x="110" y="50" width="140" height="24" rx="5"/>
    <text x="120" y="67" class="f62-sm">BUILD files</text>

    <!-- Analysis of the three top-level targets -->
    <rect class="f62-bz" x="170" y="100" width="130" height="22" rx="5"/>
    <text x="180" y="116" class="f62-sm">greet</text>
    <rect class="f62-bz" x="200" y="126" width="180" height="22" rx="5"/>
    <text x="210" y="142" class="f62-sm">hello</text>
    <rect class="f62-bz" x="240" y="152" width="230" height="22" rx="5"/>
    <text x="250" y="168" class="f62-sm">greet_test</text>

    <!-- Execution -->
    <rect class="f62-run" x="300" y="204" width="118" height="22" rx="5"/>
    <text x="308" y="220" class="f62-sm">compile greet</text>
    <rect class="f62-run" x="422" y="204" width="96" height="22" rx="5"/>
    <text x="430" y="220" class="f62-sm">compile hello</text>
    <rect class="f62-run" x="522" y="204" width="88" height="22" rx="5"/>
    <text x="530" y="220" class="f62-sm">link hello</text>
    <rect class="f62-run" x="472" y="230" width="96" height="22" rx="5"/>
    <text x="480" y="246" class="f62-sm">compile test</text>
    <rect class="f62-run" x="572" y="230" width="80" height="22" rx="5"/>
    <text x="580" y="246" class="f62-sm">link test</text>
  </g>

  <!-- The overlap -->
  <g class="f62-end">
    <text x="385" y="280" text-anchor="middle" class="f62-note">greet compiles while greet_test is analyzed</text>
  </g>

  <line class="f62-cursor" x1="100" y1="40" x2="100" y2="262"/>

  <!-- Time axis -->
  <line class="f62-axis" x1="110" y1="300" x2="700" y2="300" marker-end="url(#f62-arrow)"/>
  <text x="110" y="316" class="f62-note">time</text>
</svg>
