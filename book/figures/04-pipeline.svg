<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="f41-title" class="f41">
  <title id="f41-title">The steps of one go build. Loading, the action graph, and each action's ID and cache lookup run on every build.</title>
  <style>
    .f41 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f41 .f41-sm { font-size: 13px; opacity: 0.8; }
    .f41 .f41-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .f41 .f41-box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .f41 .f41-run { fill: #d9822b; fill-opacity: 0.15; stroke: #d9822b; stroke-width: 1.5; }
    .f41 .f41-hit { fill: #8a8f98; fill-opacity: 0.12; stroke: #8a8f98; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .f41 .f41-go { fill: none; stroke: #0b7fab; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .f41 .f41-golabel { fill: #0b7fab; font-weight: 600; }
    .f41 .f41-line { fill: none; stroke: currentColor; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="f41-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Row 1: patterns, loading, action graph -->
  <rect class="f41-box" x="20" y="20" width="160" height="64" rx="8"/>
  <text x="100" y="47" text-anchor="middle">patterns</text>
  <text x="100" y="67" text-anchor="middle" class="f41-mono f41-sm">./...</text>

  <rect class="f41-run" x="260" y="20" width="200" height="64" rx="8"/>
  <text x="360" y="47" text-anchor="middle">load packages</text>
  <text x="360" y="67" text-anchor="middle" class="f41-sm">list dirs, check every file</text>

  <rect class="f41-run" x="540" y="20" width="160" height="64" rx="8"/>
  <text x="620" y="47" text-anchor="middle">action graph</text>
  <text x="620" y="67" text-anchor="middle" class="f41-sm">compiles and links</text>

  <line class="f41-line" x1="180" y1="52" x2="256" y2="52" marker-end="url(#f41-arrow)"/>
  <line class="f41-line" x1="460" y1="52" x2="536" y2="52" marker-end="url(#f41-arrow)"/>
  <line class="f41-line" x1="620" y1="84" x2="620" y2="126" marker-end="url(#f41-arrow)"/>

  <!-- Row 2: per action -->
  <rect class="f41-go" x="20" y="130" width="680" height="160" rx="10"/>
  <text x="36" y="154" class="f41-golabel">each action, on -p workers</text>

  <rect class="f41-run" x="40" y="186" width="180" height="64" rx="8"/>
  <text x="130" y="213" text-anchor="middle">action ID</text>
  <text x="130" y="233" text-anchor="middle" class="f41-sm">hash every input file</text>

  <rect class="f41-run" x="270" y="186" width="160" height="64" rx="8"/>
  <text x="350" y="213" text-anchor="middle">look up</text>
  <text x="350" y="233" text-anchor="middle" class="f41-sm f41-mono">GOCACHE</text>

  <rect class="f41-hit" x="490" y="164" width="190" height="48" rx="8"/>
  <text x="585" y="193" text-anchor="middle">hit: reuse output</text>

  <rect class="f41-box" x="490" y="228" width="190" height="48" rx="8"/>
  <text x="585" y="257" text-anchor="middle">miss: run the tool</text>

  <line class="f41-line" x1="220" y1="218" x2="266" y2="218" marker-end="url(#f41-arrow)"/>
  <path class="f41-line" d="M430,210 L460,210 L460,188 L486,188" marker-end="url(#f41-arrow)"/>
  <path class="f41-line" d="M430,226 L460,226 L460,252 L486,252" marker-end="url(#f41-arrow)"/>

  <!-- Legend -->
  <rect class="f41-run" x="20" y="308" width="22" height="16" rx="3"/>
  <text x="50" y="321" class="f41-sm">runs on every build, even when nothing changed</text>
  <rect class="f41-hit" x="440" y="308" width="22" height="16" rx="3"/>
  <text x="470" y="321" class="f41-sm">skipped on a cache hit</text>
</svg>
