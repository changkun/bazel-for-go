<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="f101-title" class="f101">
  <title id="f101-title">The book's view of where each tool fits, not a measurement. The horizontal axis is the size of one build, from one module to more than one machine can run; the vertical axis is how many machines build the same code, from one to a CI fleet. A curve marks where enough machines build the same code for a shared Go cache to pay: below it, the go command alone; above it, the go command with a shared GOCACHEPROG store. A diagonal marks where work that cache cannot share dominates CI time: beyond it, Bazel with a remote cache. Past a vertical line, where one build outgrows one machine, Bazel with remote execution. The map assumes Go only; other languages or generators in the graph enlarge the regions where Bazel fits.</title>
  <style>
    .f101 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f101 .f101-note { font-size: 13px; fill-opacity: .65; font-style: italic; }
    .f101 .f101-axis { font-size: 13px; fill-opacity: .8; }
    .f101 .f101-head { font-weight: 600; }
    .f101 .f101-gotext { fill: #007D9C; }
    .f101 .f101-bztext { fill: #388E3C; }
    .f101 .f101-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f101 .f101-shared { fill: #7e57c2; }
    .f101 .f101-go { fill: #00ADD8; fill-opacity: .12; stroke: none; }
    .f101 .f101-go2 { fill: #00ADD8; fill-opacity: .18; stroke: none; }
    .f101 .f101-bz { fill: #43A047; fill-opacity: .12; stroke: none; }
    .f101 .f101-bz2 { fill: #43A047; fill-opacity: .18; stroke: none; }
    .f101 .f101-edge { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.3; }
    .f101 .f101-ax { fill: none; stroke: currentColor; stroke-opacity: .8; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="f101-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="f101-note" x="704" y="22" text-anchor="end">the book's view, not a measurement</text>

  <!-- regions: plot area x 96..704, y 40..300 -->
  <path class="f101-go" d="M96,178 C220,168 360,166 473.2,172 L560,252 L560,300 L96,300 Z"/>
  <path class="f101-go2" d="M96,40 L330,40 L473.2,172 C360,166 220,168 96,178 Z"/>
  <path class="f101-bz" d="M330,40 L560,40 L560,252 Z"/>
  <path class="f101-bz2" d="M560,40 L704,40 L704,300 L560,300 Z"/>

  <!-- boundaries -->
  <path class="f101-edge" d="M96,178 C220,168 360,166 473.2,172"/>
  <path class="f101-edge" d="M330,40 L560,252"/>
  <path class="f101-edge" d="M560,40 L560,300"/>

  <!-- labels -->
  <text class="f101-head f101-gotext" x="250" y="246" text-anchor="middle">go command</text>

  <text class="f101-head f101-gotext" x="200" y="100" text-anchor="middle">go command</text>
  <text class="f101-mono f101-shared" x="200" y="122" text-anchor="middle">+ GOCACHEPROG</text>
  <text class="f101-shared" x="200" y="142" text-anchor="middle" style="font-size:13px">shared store</text>

  <text class="f101-head f101-bztext" x="486" y="84" text-anchor="middle">Bazel</text>
  <text class="f101-shared" x="486" y="106" text-anchor="middle">+ remote cache</text>

  <text class="f101-head f101-bztext" x="632" y="148" text-anchor="middle">Bazel</text>
  <text class="f101-shared" x="632" y="170" text-anchor="middle">+ remote</text>
  <text class="f101-shared" x="632" y="190" text-anchor="middle">execution</text>

  <!-- axes -->
  <line class="f101-ax" x1="96" y1="300" x2="96" y2="36" marker-end="url(#f101-arrow)"/>
  <line class="f101-ax" x1="96" y1="300" x2="708" y2="300" marker-end="url(#f101-arrow)"/>
  <text class="f101-axis" x="88" y="52" text-anchor="end">CI fleet</text>
  <text class="f101-axis" x="88" y="300" text-anchor="end">one</text>
  <text class="f101-axis" transform="translate(28,170) rotate(-90)" text-anchor="middle">machines building the same code</text>
  <text class="f101-axis" x="96" y="320">one module</text>
  <text class="f101-axis" x="330" y="320" text-anchor="middle">size of one build</text>
  <text class="f101-axis" x="632" y="320" text-anchor="middle">beyond one machine</text>

  <text class="f101-note" x="96" y="356">Go only. Other languages or generators in the graph enlarge Bazel's regions.</text>
</svg>
