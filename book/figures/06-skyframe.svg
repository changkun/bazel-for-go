<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="f63-title" class="f63">
  <title id="f63-title">Skyframe after an edit to greet.go that leaves its compiled output unchanged. The file node changes and every node above it is marked dirty. compile greet reruns and writes the same bytes with new file times, so its value changes. compile hello and link hello are checked against the action cache, find their inputs' hashes unchanged and do not run; their values are unchanged, so the node that marks hello as built is resurrected without being recomputed. main.go is never touched.</title>
  <style>
    .f63 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f63 .f63-sm { font-size: 13px; opacity: 0.8; }
    .f63 .f63-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f63 .f63-node { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .f63 .f63-run { fill: #d9822b; fill-opacity: 0.18; stroke: #d9822b; stroke-width: 1.5; }
    .f63 .f63-dirty { fill: none; stroke: #d9822b; stroke-width: 2; stroke-dasharray: 6 4; }
    .f63 .f63-hit { fill: #8a8f98; fill-opacity: 0.14; stroke: #8a8f98; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .f63 .f63-edge { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.45; }
    .f63 .f63-runtext { fill: #d9822b; font-weight: 600; }
    .f63 .f63-hittext { fill: #8a8f98; font-weight: 600; }

    /* The static state is the end state. One 9 s loop: edit, invalidate upward, rerun, cache hits, resurrect. */
    .f63 .f63-a1 { animation: f63-a1 9s linear infinite; }
    .f63 .f63-a2 { animation: f63-a2 9s linear infinite; }
    .f63 .f63-a3 { animation: f63-a3 9s linear infinite; }
    .f63 .f63-a4 { animation: f63-a4 9s linear infinite; }
    .f63 .f63-a5 { animation: f63-a5 9s linear infinite; }
    .f63 .f63-a6 { animation: f63-a6 9s linear infinite; }
    .f63 .f63-a7 { animation: f63-a7 9s linear infinite; }
    .f63 .f63-a6off { opacity: 0; animation: f63-a6off 9s linear infinite; }
    .f63 .f63-a7off { opacity: 0; animation: f63-a7off 9s linear infinite; }
    .f63 .f63-dg { opacity: 0; animation: f63-dg 9s linear infinite; }
    .f63 .f63-dh { opacity: 0; animation: f63-dh 9s linear infinite; }
    .f63 .f63-dl { opacity: 0; animation: f63-dl 9s linear infinite; }
    .f63 .f63-dt { opacity: 0; animation: f63-dt 9s linear infinite; }
    @keyframes f63-a1 { 0%, 4% { opacity: 0; } 8%, 100% { opacity: 1; } }
    @keyframes f63-a2 { 0%, 12% { opacity: 0; } 16%, 100% { opacity: 1; } }
    @keyframes f63-a3 { 0%, 38% { opacity: 0; } 42%, 100% { opacity: 1; } }
    @keyframes f63-a4 { 0%, 46% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes f63-a5 { 0%, 54% { opacity: 0; } 58%, 100% { opacity: 1; } }
    @keyframes f63-a6 { 0%, 60% { opacity: 0; } 64%, 100% { opacity: 1; } }
    @keyframes f63-a7 { 0%, 68% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes f63-a6off { 0%, 60% { opacity: 1; } 64%, 100% { opacity: 0; } }
    @keyframes f63-a7off { 0%, 68% { opacity: 1; } 72%, 100% { opacity: 0; } }
    @keyframes f63-dg { 0%, 12% { opacity: 0; } 16%, 38% { opacity: 1; } 42%, 100% { opacity: 0; } }
    @keyframes f63-dh { 0%, 18% { opacity: 0; } 22%, 54% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes f63-dl { 0%, 24% { opacity: 0; } 28%, 60% { opacity: 1; } 64%, 100% { opacity: 0; } }
    @keyframes f63-dt { 0%, 30% { opacity: 0; } 34%, 68% { opacity: 1; } 72%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Edges: each node points down to the nodes it read -->
  <g class="f63-edge">
    <line x1="195" y1="60" x2="195" y2="100"/>
    <line x1="230" y1="140" x2="300" y2="180"/>
    <line x1="160" y1="140" x2="115" y2="260"/>
    <line x1="270" y1="220" x2="160" y2="260"/>
    <line x1="320" y1="220" x2="320" y2="340"/>
    <line x1="115" y1="300" x2="115" y2="340"/>
  </g>

  <!-- hello, the top-level target -->
  <rect class="f63-node f63-a7off" x="120" y="20" width="150" height="40" rx="8"/>
  <rect class="f63-hit f63-a7" x="120" y="20" width="150" height="40" rx="8"/>
  <rect class="f63-dirty f63-dt" x="120" y="20" width="150" height="40" rx="8"/>
  <text x="195" y="45" text-anchor="middle"><tspan class="f63-mono">hello</tspan> built</text>

  <!-- link hello -->
  <rect class="f63-node f63-a6off" x="120" y="100" width="150" height="40" rx="8"/>
  <rect class="f63-hit f63-a6" x="120" y="100" width="150" height="40" rx="8"/>
  <rect class="f63-dirty f63-dl" x="120" y="100" width="150" height="40" rx="8"/>
  <text x="195" y="125" text-anchor="middle" class="f63-mono">link hello</text>

  <!-- compile hello -->
  <rect class="f63-node f63-a6off" x="245" y="180" width="150" height="40" rx="8"/>
  <rect class="f63-hit f63-a6" x="245" y="180" width="150" height="40" rx="8"/>
  <rect class="f63-dirty f63-dh" x="245" y="180" width="150" height="40" rx="8"/>
  <text x="320" y="205" text-anchor="middle" class="f63-mono">compile hello</text>

  <!-- compile greet -->
  <rect class="f63-node" x="40" y="260" width="150" height="40" rx="8"/>
  <rect class="f63-run f63-a3" x="40" y="260" width="150" height="40" rx="8"/>
  <rect class="f63-dirty f63-dg" x="40" y="260" width="150" height="40" rx="8"/>
  <text x="115" y="285" text-anchor="middle" class="f63-mono">compile greet</text>
  <g class="f63-a4">
    <text x="198" y="282" class="f63-sm">same bytes,</text>
    <text x="198" y="300" class="f63-sm">new file times</text>
  </g>

  <!-- Files -->
  <rect class="f63-node" x="40" y="340" width="150" height="40" rx="8"/>
  <rect class="f63-run f63-a1" x="40" y="340" width="150" height="40" rx="8"/>
  <text x="115" y="365" text-anchor="middle" class="f63-mono">greet.go</text>
  <rect class="f63-node" x="245" y="340" width="150" height="40" rx="8"/>
  <text x="320" y="365" text-anchor="middle" class="f63-mono">main.go</text>

  <!-- Steps -->
  <g class="f63-a1">
    <text x="440" y="44" class="f63-runtext">1. edit</text>
    <text x="440" y="64" class="f63-sm">greet.go changes</text>
  </g>
  <g class="f63-a2">
    <text x="440" y="110" class="f63-runtext">2. invalidate</text>
    <text x="440" y="130" class="f63-sm">every node above is marked dirty</text>
  </g>
  <g class="f63-a3">
    <text x="440" y="176" class="f63-runtext">3. rerun</text>
    <text x="440" y="196" class="f63-sm">compile greet runs; its value changes</text>
  </g>
  <g class="f63-a6">
    <text x="440" y="242" class="f63-hittext">4. action cache hit</text>
    <text x="440" y="262" class="f63-sm">input hashes unchanged: not rerun,</text>
    <text x="440" y="280" class="f63-sm">values unchanged</text>
  </g>
  <g class="f63-a7">
    <text x="440" y="326" class="f63-hittext">5. resurrect</text>
    <text x="440" y="346" class="f63-sm">"hello built" is kept without rerunning</text>
  </g>
</svg>
