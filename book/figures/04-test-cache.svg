<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="f45-title" class="f45">
  <title id="f45-title">The two-level test cache. The test ID finds what the last run read; the current state of those inputs gives the inputs ID; both together find the stored result.</title>
  <style>
    .f45 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f45 .f45-sm { font-size: 13px; opacity: 0.8; }
    .f45 .f45-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f45 .f45-box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .f45 .f45-go { fill: #00ADD8; fill-opacity: 0.12; stroke: #00ADD8; stroke-width: 1.5; }
    .f45 .f45-golabel { fill: #007D9C; font-weight: 600; font-size: 13px; }
    .f45 .f45-hit { fill: #8a8f98; fill-opacity: 0.14; stroke: #8a8f98; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .f45 .f45-line { fill: none; stroke: currentColor; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="f45-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Level 1 -->
  <rect class="f45-box" x="20" y="20" width="190" height="70" rx="8"/>
  <text x="115" y="50" text-anchor="middle">test binary</text>
  <text x="115" y="72" text-anchor="middle" class="f45-sm">+ cacheable flags</text>

  <rect class="f45-go" x="240" y="20" width="150" height="70" rx="8"/>
  <text x="315" y="46" text-anchor="middle" class="f45-golabel">level 1</text>
  <text x="315" y="68" text-anchor="middle">test ID</text>

  <rect class="f45-box" x="420" y="20" width="280" height="90" rx="8"/>
  <text x="436" y="42" class="f45-sm">logged by the last run</text>
  <text x="436" y="63" class="f45-mono">getenv APP_ENV</text>
  <text x="436" y="81" class="f45-mono">open testdata/in.json</text>
  <text x="436" y="99" class="f45-mono">stat config.yaml</text>

  <line class="f45-line" x1="210" y1="55" x2="236" y2="55" marker-end="url(#f45-arrow)"/>
  <line class="f45-line" x1="390" y1="55" x2="416" y2="55" marker-end="url(#f45-arrow)"/>

  <!-- Level 2 -->
  <rect class="f45-go" x="420" y="160" width="280" height="80" rx="8"/>
  <text x="436" y="183" class="f45-golabel">level 2</text>
  <text x="510" y="183">inputs ID</text>
  <text x="436" y="205" class="f45-sm">each variable's value now, each</text>
  <text x="436" y="225" class="f45-sm">file's size and modification time</text>

  <rect class="f45-box" x="240" y="165" width="150" height="70" rx="8"/>
  <text x="315" y="194" text-anchor="middle">key</text>
  <text x="315" y="216" text-anchor="middle" class="f45-sm">test ID + inputs ID</text>

  <rect class="f45-hit" x="20" y="165" width="190" height="70" rx="8"/>
  <text x="115" y="194" text-anchor="middle">cached result</text>
  <text x="115" y="216" text-anchor="middle" class="f45-mono">ok (cached)</text>

  <line class="f45-line" x1="560" y1="110" x2="560" y2="156" marker-end="url(#f45-arrow)"/>
  <line class="f45-line" x1="315" y1="90" x2="315" y2="161" marker-end="url(#f45-arrow)"/>
  <line class="f45-line" x1="420" y1="200" x2="394" y2="200" marker-end="url(#f45-arrow)"/>
  <line class="f45-line" x1="240" y1="200" x2="214" y2="200" marker-end="url(#f45-arrow)"/>
</svg>
