<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="f92-title" class="f92">
  <title id="f92-title">Schematic. The execution log entries for the same stamped GoLink action from two machines, compared field by field. The mnemonic, target label, command line, environment and the archive inputs match. One input, bazel-out/stable-status.txt, has a different hash, so the action's key differs and the second machine misses the cache. The status files differ because they record BUILD_HOST and BUILD_USER.</title>
  <style>
    .f92 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f92 .f92-head { font-weight: 600; }
    .f92 .f92-key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; opacity: 0.7; }
    .f92 .f92-val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f92 .f92-sm { font-size: 13px; opacity: 0.8; }
    .f92 .f92-card { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: 0.6; }
    .f92 .f92-rule { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.18; }
    .f92 .f92-diff { fill: #d9822b; fill-opacity: 0.16; stroke: #d9822b; stroke-width: 1.5; }
    .f92 .f92-difftext { fill: #d9822b; font-weight: 600; }
    .f92 .f92-same { font-size: 16px; opacity: 0.55; }
    .f92 .f92-ne { font-size: 16px; fill: #d9822b; font-weight: 700; }
    /* The static state is the end state. One 9 s loop: the rows are compared top to bottom,
       the differing input and key light up, then the status files appear, then a pause. */
    .f92 .f92-c1 { animation: f92-k1 9s linear infinite; }
    .f92 .f92-c2 { animation: f92-k2 9s linear infinite; }
    .f92 .f92-c3 { animation: f92-k3 9s linear infinite; }
    .f92 .f92-c4 { animation: f92-k4 9s linear infinite; }
    .f92 .f92-c5 { animation: f92-k5 9s linear infinite; }
    .f92 .f92-c6 { animation: f92-k6 9s linear infinite; }
    .f92 .f92-c7 { animation: f92-k7 9s linear infinite; }
    .f92 .f92-c8 { animation: f92-k8 9s linear infinite; }
    @keyframes f92-k1 { 0%, 4% { opacity: 0; } 7%, 100% { opacity: 1; } }
    @keyframes f92-k2 { 0%, 10% { opacity: 0; } 13%, 100% { opacity: 1; } }
    @keyframes f92-k3 { 0%, 16% { opacity: 0; } 19%, 100% { opacity: 1; } }
    @keyframes f92-k4 { 0%, 22% { opacity: 0; } 25%, 100% { opacity: 1; } }
    @keyframes f92-k5 { 0%, 28% { opacity: 0; } 31%, 100% { opacity: 1; } }
    @keyframes f92-k6 { 0%, 36% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes f92-k7 { 0%, 46% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes f92-k8 { 0%, 58% { opacity: 0; } 63%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <text x="176" y="24" text-anchor="middle" class="f92-head">machine A</text>
  <text x="544" y="24" text-anchor="middle" class="f92-head">machine B</text>

  <rect class="f92-card" x="16" y="34" width="320" height="290" rx="8"/>
  <rect class="f92-card" x="384" y="34" width="320" height="290" rx="8"/>
  <g class="f92-rule">
    <line x1="24" y1="80" x2="328" y2="80"/><line x1="392" y1="80" x2="696" y2="80"/>
    <line x1="24" y1="120" x2="328" y2="120"/><line x1="392" y1="120" x2="696" y2="120"/>
    <line x1="24" y1="160" x2="328" y2="160"/><line x1="392" y1="160" x2="696" y2="160"/>
    <line x1="24" y1="200" x2="328" y2="200"/><line x1="392" y1="200" x2="696" y2="200"/>
    <line x1="24" y1="240" x2="328" y2="240"/><line x1="392" y1="240" x2="696" y2="240"/>
    <line x1="24" y1="280" x2="328" y2="280"/><line x1="392" y1="280" x2="696" y2="280"/>
  </g>

  <!-- Highlights for the rows that differ -->
  <g class="f92-c6">
    <rect class="f92-diff" x="20" y="242" width="312" height="36" rx="5"/>
    <rect class="f92-diff" x="388" y="242" width="312" height="36" rx="5"/>
  </g>
  <g class="f92-c7">
    <rect class="f92-diff" x="20" y="282" width="312" height="36" rx="5"/>
    <rect class="f92-diff" x="388" y="282" width="312" height="36" rx="5"/>
  </g>

  <!-- Rows: field name above, value below -->
  <g>
    <text x="28" y="55" class="f92-key">mnemonic</text>
    <text x="28" y="72" class="f92-val">GoLink</text>
    <text x="396" y="55" class="f92-key">mnemonic</text>
    <text x="396" y="72" class="f92-val">GoLink</text>

    <text x="28" y="95" class="f92-key">target_label</text>
    <text x="28" y="112" class="f92-val">//cmd/hello:hello</text>
    <text x="396" y="95" class="f92-key">target_label</text>
    <text x="396" y="112" class="f92-val">//cmd/hello:hello</text>

    <text x="28" y="135" class="f92-key">command_args</text>
    <text x="28" y="152" class="f92-val">builder link -stamp … -X …</text>
    <text x="396" y="135" class="f92-key">command_args</text>
    <text x="396" y="152" class="f92-val">builder link -stamp … -X …</text>

    <text x="28" y="175" class="f92-key">environment_variables</text>
    <text x="28" y="192" class="f92-val">GOOS=linux GOARCH=amd64 …</text>
    <text x="396" y="175" class="f92-key">environment_variables</text>
    <text x="396" y="192" class="f92-val">GOOS=linux GOARCH=amd64 …</text>

    <text x="28" y="215" class="f92-key">inputs</text>
    <text x="28" y="232" class="f92-val">bazel-out/…/greet.a</text>
    <text x="324" y="232" text-anchor="end" class="f92-val">9f2c…</text>
    <text x="396" y="215" class="f92-key">inputs</text>
    <text x="396" y="232" class="f92-val">bazel-out/…/greet.a</text>
    <text x="692" y="232" text-anchor="end" class="f92-val">9f2c…</text>

    <text x="28" y="255" class="f92-key">inputs</text>
    <text x="28" y="272" class="f92-val">bazel-out/stable-status.txt</text>
    <text x="324" y="272" text-anchor="end" class="f92-val">41d7…</text>
    <text x="396" y="255" class="f92-key">inputs</text>
    <text x="396" y="272" class="f92-val">bazel-out/stable-status.txt</text>
    <text x="692" y="272" text-anchor="end" class="f92-val">c08e…</text>

    <text x="28" y="295" class="f92-key">digest (the key)</text>
    <text x="28" y="312" class="f92-val">e3a1…</text>
    <text x="396" y="295" class="f92-key">digest (the key)</text>
    <text x="396" y="312" class="f92-val">7b54…</text>
  </g>

  <!-- Comparison marks in the gutter -->
  <text x="360" y="68" text-anchor="middle" class="f92-same f92-c1">=</text>
  <text x="360" y="108" text-anchor="middle" class="f92-same f92-c2">=</text>
  <text x="360" y="148" text-anchor="middle" class="f92-same f92-c3">=</text>
  <text x="360" y="188" text-anchor="middle" class="f92-same f92-c4">=</text>
  <text x="360" y="228" text-anchor="middle" class="f92-same f92-c5">=</text>
  <text x="360" y="268" text-anchor="middle" class="f92-ne f92-c6">≠</text>
  <text x="360" y="308" text-anchor="middle" class="f92-ne f92-c7">≠</text>

  <!-- What the status files hold -->
  <g class="f92-c8">
    <text x="360" y="348" text-anchor="middle" class="f92-sm">bazel-out/stable-status.txt on each machine</text>
    <rect class="f92-card" x="16" y="358" width="320" height="72" rx="8"/>
    <rect class="f92-card" x="384" y="358" width="320" height="72" rx="8"/>
    <text x="28" y="380" class="f92-val f92-difftext">BUILD_HOST runner-1</text>
    <text x="28" y="399" class="f92-val f92-difftext">BUILD_USER ci</text>
    <text x="28" y="418" class="f92-val">STABLE_GIT_COMMIT 4e1d…</text>
    <text x="396" y="380" class="f92-val f92-difftext">BUILD_HOST laptop-7</text>
    <text x="396" y="399" class="f92-val f92-difftext">BUILD_USER dev</text>
    <text x="396" y="418" class="f92-val">STABLE_GIT_COMMIT 4e1d…</text>
  </g>
</svg>
