<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" role="img" aria-labelledby="f13-title">
  <title id="f13-title">The six decisions a build system makes: unit, graph, change, key, sharing and execution. Each row gives the question and the range of answers, from one end to the other.</title>
  <style>
    .f13 { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f13-head { font-size: 13px; fill-opacity: .65; }
    .f13-label { font-size: 15px; font-weight: 600; }
    .f13-num { font-size: 13px; font-weight: 600; }
    .f13-end { font-size: 13px; }
    .f13-circle { fill: none; stroke: currentColor; stroke-width: 1.3; }
    .f13-rule { stroke: currentColor; stroke-opacity: .15; stroke-width: 1; }
    .f13-dial { stroke: currentColor; stroke-opacity: .5; stroke-width: 1.3; }
    .f13-stop { fill: none; stroke: currentColor; stroke-opacity: .6; stroke-width: 1.3; }
  </style>

  <g class="f13">
    <text class="f13-head" x="24" y="22">decision</text>
    <text class="f13-head" x="170" y="22">question</text>
    <text class="f13-head" x="584" y="22" text-anchor="middle">range of answers</text>
    <line class="f13-rule" x1="16" y1="34" x2="704" y2="34"/>

    <!-- 1 -->
    <g transform="translate(0,34)">
      <circle class="f13-circle" cx="36" cy="21" r="11"/><text class="f13-num" x="36" y="25.5" text-anchor="middle">1</text>
      <text class="f13-label" x="56" y="26">Unit</text>
      <text x="170" y="26">How much does one action do?</text>
      <text class="f13-end" x="532" y="26" text-anchor="end">module</text>
      <line class="f13-dial" x1="544" y1="21" x2="624" y2="21"/><circle class="f13-stop" cx="544" cy="21" r="3.5"/><circle class="f13-stop" cx="624" cy="21" r="3.5"/>
      <text class="f13-end" x="636" y="26">file</text>
      <line class="f13-rule" x1="16" y1="42" x2="704" y2="42"/>
    </g>
    <!-- 2 -->
    <g transform="translate(0,76)">
      <circle class="f13-circle" cx="36" cy="21" r="11"/><text class="f13-num" x="36" y="25.5" text-anchor="middle">2</text>
      <text class="f13-label" x="56" y="26">Graph</text>
      <text x="170" y="26">Where does the graph come from?</text>
      <text class="f13-end" x="532" y="26" text-anchor="end">derived</text>
      <line class="f13-dial" x1="544" y1="21" x2="624" y2="21"/><circle class="f13-stop" cx="544" cy="21" r="3.5"/><circle class="f13-stop" cx="624" cy="21" r="3.5"/>
      <text class="f13-end" x="636" y="26">declared</text>
      <line class="f13-rule" x1="16" y1="42" x2="704" y2="42"/>
    </g>
    <!-- 3 -->
    <g transform="translate(0,118)">
      <circle class="f13-circle" cx="36" cy="21" r="11"/><text class="f13-num" x="36" y="25.5" text-anchor="middle">3</text>
      <text class="f13-label" x="56" y="26">Change</text>
      <text x="170" y="26">How is a change found?</text>
      <text class="f13-end" x="532" y="26" text-anchor="end">rehash all</text>
      <line class="f13-dial" x1="544" y1="21" x2="624" y2="21"/><circle class="f13-stop" cx="544" cy="21" r="3.5"/><circle class="f13-stop" cx="624" cy="21" r="3.5"/>
      <text class="f13-end" x="636" y="26">notified</text>
      <line class="f13-rule" x1="16" y1="42" x2="704" y2="42"/>
    </g>
    <!-- 4 -->
    <g transform="translate(0,160)">
      <circle class="f13-circle" cx="36" cy="21" r="11"/><text class="f13-num" x="36" y="25.5" text-anchor="middle">4</text>
      <text class="f13-label" x="56" y="26">Key</text>
      <text x="170" y="26">What enters the key?</text>
      <text class="f13-end" x="532" y="26" text-anchor="end">whole output</text>
      <line class="f13-dial" x1="544" y1="21" x2="624" y2="21"/><circle class="f13-stop" cx="544" cy="21" r="3.5"/><circle class="f13-stop" cx="624" cy="21" r="3.5"/>
      <text class="f13-end" x="636" y="26">part read</text>
      <line class="f13-rule" x1="16" y1="42" x2="704" y2="42"/>
    </g>
    <!-- 5 -->
    <g transform="translate(0,202)">
      <circle class="f13-circle" cx="36" cy="21" r="11"/><text class="f13-num" x="36" y="25.5" text-anchor="middle">5</text>
      <text class="f13-label" x="56" y="26">Sharing</text>
      <text x="170" y="26">How far is the cache shared?</text>
      <text class="f13-end" x="532" y="26" text-anchor="end">one process</text>
      <line class="f13-dial" x1="544" y1="21" x2="624" y2="21"/><circle class="f13-stop" cx="544" cy="21" r="3.5"/><circle class="f13-stop" cx="624" cy="21" r="3.5"/>
      <text class="f13-end" x="636" y="26">a team</text>
      <line class="f13-rule" x1="16" y1="42" x2="704" y2="42"/>
    </g>
    <!-- 6 -->
    <g transform="translate(0,244)">
      <circle class="f13-circle" cx="36" cy="21" r="11"/><text class="f13-num" x="36" y="25.5" text-anchor="middle">6</text>
      <text class="f13-label" x="56" y="26">Execution</text>
      <text x="170" y="26">Where do actions run?</text>
      <text class="f13-end" x="532" y="26" text-anchor="end">local</text>
      <line class="f13-dial" x1="544" y1="21" x2="624" y2="21"/><circle class="f13-stop" cx="544" cy="21" r="3.5"/><circle class="f13-stop" cx="624" cy="21" r="3.5"/>
      <text class="f13-end" x="636" y="26">remote</text>
    </g>
  </g>
</svg>
