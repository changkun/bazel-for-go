<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 166" role="img" aria-labelledby="f14-title">
  <title id="f14-title">Illustrative shares of one build's time, not to scale. For one engineer's edit on a laptop with no long-lived process, obtaining the graph and finding what changed take most of the time; running the few affected actions takes the rest. On a fresh CI runner with no shared cache, the graph is obtained from scratch and running every action dominates.</title>
  <style>
    .f14 { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f14-term { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f14-graph { fill: currentColor; fill-opacity: .2; stroke: currentColor; stroke-opacity: .7; stroke-width: 1.2; }
    .f14-detect { fill: url(#f14-hatch); stroke: currentColor; stroke-opacity: .7; stroke-width: 1.2; }
    .f14-exec { fill: #d9822b; fill-opacity: .18; stroke: #d9822b; stroke-width: 1.2; }
  </style>
  <defs>
    <pattern id="f14-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-opacity=".22" stroke-width="2"/>
    </pattern>
  </defs>

  <g class="f14">
    <!-- one engineer's edit; no long-lived process keeps the graph -->
    <text x="24" y="22">One engineer's edit; no long-lived process</text>
    <rect class="f14-graph" x="24" y="32" width="200" height="34" rx="3"/>
    <rect class="f14-detect" x="227" y="32" width="250" height="34" rx="3"/>
    <rect class="f14-exec" x="480" y="32" width="216" height="34" rx="3"/>
    <text class="f14-term" x="124" y="53.5" text-anchor="middle">T_graph</text>
    <text class="f14-term" x="352" y="53.5" text-anchor="middle">T_detect</text>
    <text class="f14-term" x="588" y="53.5" text-anchor="middle">T_exec</text>

    <!-- a fresh CI runner; no shared cache -->
    <text x="24" y="100">Fresh CI runner; no shared cache</text>
    <rect class="f14-graph" x="24" y="110" width="196" height="34" rx="3"/>
    <rect class="f14-detect" x="223" y="110" width="80" height="34" rx="3"/>
    <rect class="f14-exec" x="306" y="110" width="390" height="34" rx="3"/>
    <text class="f14-term" x="122" y="131.5" text-anchor="middle">T_graph</text>
    <text class="f14-term" x="263" y="131.5" text-anchor="middle">T_detect</text>
    <text class="f14-term" x="501" y="131.5" text-anchor="middle">T_exec</text>
  </g>
</svg>
