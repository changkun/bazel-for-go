<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" aria-labelledby="f102-title" class="f102">
  <title id="f102-title">A migration path in five steps. 1: Gazelle generates BUILD files. 2: CI builds and tests both ways, with Bazel and with go vet and go test, and requires a clean Gazelle diff. 3: a shared cache that CI writes and other machines only read. 4: Bazel becomes CI's required check, then laptops move. 5: remote execution, only if one machine is not enough. From step 2 on, go vet and go test keep passing on packages that need no Bazel-only input.</title>
  <style>
    .f102 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f102 .f102-head { font-size: 13px; fill-opacity: .65; }
    .f102 .f102-label { font-size: 15px; font-weight: 600; }
    .f102 .f102-sub { font-size: 13px; fill-opacity: .7; font-style: italic; }
    .f102 .f102-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f102 .f102-gotext { fill: #007D9C; }
    .f102 .f102-num { font-size: 13px; font-weight: 700; }
    .f102 .f102-rail { stroke: currentColor; stroke-opacity: .3; stroke-width: 2; }
    .f102 .f102-bz { fill: #43A047; fill-opacity: .16; stroke: #43A047; stroke-width: 1.5; }
    .f102 .f102-rm { fill: #7e57c2; fill-opacity: .16; stroke: #7e57c2; stroke-width: 1.5; }
    .f102 .f102-go { fill: none; stroke: #00ADD8; stroke-width: 2; }
    .f102 .f102-rule { stroke: currentColor; stroke-opacity: .12; stroke-width: 1; }

    /* The static state is the end state. One 8 s loop: steps 1 to 5 light up, then a pause. */
    .f102 .f102-r1 { animation: f102-k1 8s linear infinite; }
    .f102 .f102-r2 { animation: f102-k2 8s linear infinite; }
    .f102 .f102-r3 { animation: f102-k3 8s linear infinite; }
    .f102 .f102-r4 { animation: f102-k4 8s linear infinite; }
    .f102 .f102-r5 { animation: f102-k5 8s linear infinite; }
    @keyframes f102-k1 { 0%, 3% { opacity: .15; } 7%, 100% { opacity: 1; } }
    @keyframes f102-k2 { 0%, 16% { opacity: .15; } 20%, 100% { opacity: 1; } }
    @keyframes f102-k3 { 0%, 29% { opacity: .15; } 33%, 100% { opacity: 1; } }
    @keyframes f102-k4 { 0%, 42% { opacity: .15; } 46%, 100% { opacity: 1; } }
    @keyframes f102-k5 { 0%, 55% { opacity: .15; } 59%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <text class="f102-head" x="70" y="22">step</text>
  <text class="f102-head" x="372" y="22">what to run</text>
  <line class="f102-rule" x1="16" y1="34" x2="704" y2="34"/>

  <line class="f102-rail" x1="40" y1="75" x2="40" y2="113"/>
  <line class="f102-rail" x1="40" y1="139" x2="40" y2="185"/>
  <line class="f102-rail" x1="40" y1="211" x2="40" y2="241"/>
  <line class="f102-rail" x1="40" y1="267" x2="40" y2="297"/>

  <!-- 1 -->
  <g class="f102-r1">
    <circle class="f102-bz" cx="40" cy="62" r="13"/>
    <text class="f102-num" x="40" y="66.5" text-anchor="middle">1</text>
    <text class="f102-label" x="70" y="67">Generate BUILD files</text>
    <text class="f102-mono" x="372" y="67">bazel run //:gazelle</text>
  </g>
  <!-- 2 -->
  <g class="f102-r2">
    <circle class="f102-bz" cx="40" cy="126" r="13"/>
    <text class="f102-num" x="40" y="130.5" text-anchor="middle">2</text>
    <text class="f102-label" x="70" y="122">Build both ways in CI</text>
    <text class="f102-sub" x="70" y="141">go and bazel must both pass</text>
    <text class="f102-mono" x="372" y="107">bazel test //...</text>
    <text class="f102-mono f102-gotext" x="372" y="126">go vet ./... &amp;&amp; go test ./...</text>
    <text class="f102-mono" x="372" y="145">bazel run //:gazelle -- -mode=diff</text>
  </g>
  <!-- 3 -->
  <g class="f102-r3">
    <circle class="f102-rm" cx="40" cy="198" r="13"/>
    <text class="f102-num" x="40" y="202.5" text-anchor="middle">3</text>
    <text class="f102-label" x="70" y="194">Share a cache</text>
    <text class="f102-sub" x="70" y="213">CI writes; others only read</text>
    <text class="f102-mono" x="372" y="194">--remote_cache=…</text>
    <text class="f102-mono" x="372" y="213">--remote_upload_local_results=false</text>
  </g>
  <!-- 4 -->
  <g class="f102-r4">
    <circle class="f102-bz" cx="40" cy="254" r="13"/>
    <text class="f102-num" x="40" y="258.5" text-anchor="middle">4</text>
    <text class="f102-label" x="70" y="250">Bazel becomes CI's required check</text>
    <text class="f102-sub" x="70" y="269">then laptops, once gopls works</text>
    <text class="f102-mono" x="372" y="259">GOPACKAGESDRIVER=…</text>
  </g>
  <!-- 5 -->
  <g class="f102-r5">
    <circle class="f102-rm" cx="40" cy="310" r="13"/>
    <text class="f102-num" x="40" y="314.5" text-anchor="middle">5</text>
    <text class="f102-label" x="70" y="306">Remote execution</text>
    <text class="f102-sub" x="70" y="325">only if one machine is not enough</text>
    <text class="f102-mono" x="372" y="315">--remote_executor=…</text>
  </g>

  <!-- the go command keeps working from step 2 on -->
  <g class="f102-r2">
    <line class="f102-go" x1="16" y1="112" x2="16" y2="320"/>
    <line class="f102-go" x1="16" y1="112" x2="24" y2="112"/>
    <line class="f102-go" x1="16" y1="320" x2="24" y2="320"/>
    <text class="f102-gotext" x="16" y="360" style="font-size:13px">From step 2 on, <tspan class="f102-mono">go vet</tspan> and <tspan class="f102-mono">go test</tspan> keep passing on packages with no Bazel-only input.</text>
  </g>
</svg>
