<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" role="img" aria-labelledby="f94-title" class="f94">
  <title id="f94-title">Schematic. bazel test //... after an edit to core. The three test targets the edit reaches run; the three it does not reach report results from the cache. One of the tests that runs, web_test, has shard_count = 3, so it runs as three processes, possibly on three machines: shard 0 runs TestA and TestD, shard 1 TestB and TestE, shard 2 TestC and TestF.</title>
  <style>
    .f94 text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: currentColor; }
    .f94 .f94-sm { font-size: 13px; opacity: 0.8; }
    .f94 .f94-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .f94 .f94-node { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .f94 .f94-run { fill: #d9822b; fill-opacity: 0.18; stroke: #d9822b; stroke-width: 1.5; }
    .f94 .f94-hit { fill: #8a8f98; fill-opacity: 0.14; stroke: #8a8f98; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .f94 .f94-runtext { fill: #d9822b; font-size: 13px; font-weight: 600; }
    .f94 .f94-hittext { fill: #8a8f98; font-size: 13px; font-weight: 600; }
    .f94 .f94-runline { fill: none; stroke: #d9822b; stroke-width: 1.4; }
    .f94 .f94-hitline { fill: none; stroke: #8a8f98; stroke-width: 1.4; }
    .f94 .f94-line { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: 0.6; }
    /* The static state is the end state. One 8 s loop: unreached tests come from the cache,
       reached tests run, then the sharded test fans out, then a pause. */
    .f94 .f94-s1 { animation: f94-k1 8s linear infinite; }
    .f94 .f94-s2 { animation: f94-k2 8s linear infinite; }
    .f94 .f94-s3 { animation: f94-k3 8s linear infinite; }
    @keyframes f94-k1 { 0%, 6% { opacity: 0; } 10%, 100% { opacity: 1; } }
    @keyframes f94-k2 { 0%, 18% { opacity: 0; } 22%, 100% { opacity: 1; } }
    @keyframes f94-k3 { 0%, 34% { opacity: 0; } 39%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <text x="16" y="20" class="f94-mono">bazel test //... after an edit to core</text>

  <g class="f94-s2">
    <path class="f94-runline" d="M17,54 L17,46 L353,46 L353,54"/>
    <text x="185" y="40" text-anchor="middle" class="f94-runtext">reached by the edit: run</text>
  </g>
  <g class="f94-s1">
    <path class="f94-hitline" d="M371,54 L371,46 L705,46 L705,54"/>
    <text x="538" y="40" text-anchor="middle" class="f94-hittext">not reached: results from the cache</text>
  </g>

  <!-- Test targets -->
  <rect class="f94-node" x="16" y="58" width="100" height="38" rx="7"/>
  <rect class="f94-node" x="134" y="58" width="100" height="38" rx="7"/>
  <rect class="f94-node" x="252" y="58" width="100" height="38" rx="7"/>
  <rect class="f94-node" x="370" y="58" width="100" height="38" rx="7"/>
  <rect class="f94-node" x="488" y="58" width="100" height="38" rx="7"/>
  <rect class="f94-node" x="606" y="58" width="100" height="38" rx="7"/>
  <g class="f94-s2">
    <rect class="f94-run" x="16" y="58" width="100" height="38" rx="7"/>
    <rect class="f94-run" x="134" y="58" width="100" height="38" rx="7"/>
    <rect class="f94-run" x="252" y="58" width="100" height="38" rx="7"/>
  </g>
  <g class="f94-s1">
    <rect class="f94-hit" x="370" y="58" width="100" height="38" rx="7"/>
    <rect class="f94-hit" x="488" y="58" width="100" height="38" rx="7"/>
    <rect class="f94-hit" x="606" y="58" width="100" height="38" rx="7"/>
  </g>
  <text x="66" y="82" text-anchor="middle" class="f94-mono">core_test</text>
  <text x="184" y="82" text-anchor="middle" class="f94-mono">api_test</text>
  <text x="302" y="82" text-anchor="middle" class="f94-mono">web_test</text>
  <text x="420" y="82" text-anchor="middle" class="f94-mono">batch_test</text>
  <text x="538" y="82" text-anchor="middle" class="f94-mono">cli_test</text>
  <text x="656" y="82" text-anchor="middle" class="f94-mono">util_test</text>

  <!-- Shards of web_test -->
  <g class="f94-s3">
    <line class="f94-line" x1="302" y1="96" x2="195" y2="156"/>
    <line class="f94-line" x1="302" y1="96" x2="360" y2="156"/>
    <line class="f94-line" x1="302" y1="96" x2="525" y2="156"/>
    <text x="236" y="130" text-anchor="end" class="f94-mono">shard_count = 3</text>
    <rect class="f94-run" x="120" y="158" width="150" height="62" rx="7"/>
    <rect class="f94-run" x="285" y="158" width="150" height="62" rx="7"/>
    <rect class="f94-run" x="450" y="158" width="150" height="62" rx="7"/>
    <text x="195" y="182" text-anchor="middle" class="f94-sm">shard 0</text>
    <text x="195" y="204" text-anchor="middle" class="f94-mono">TestA TestD</text>
    <text x="360" y="182" text-anchor="middle" class="f94-sm">shard 1</text>
    <text x="360" y="204" text-anchor="middle" class="f94-mono">TestB TestE</text>
    <text x="525" y="182" text-anchor="middle" class="f94-sm">shard 2</text>
    <text x="525" y="204" text-anchor="middle" class="f94-mono">TestC TestF</text>
    <text x="360" y="238" text-anchor="middle" class="f94-sm">one process each, possibly on three machines</text>
  </g>
</svg>
