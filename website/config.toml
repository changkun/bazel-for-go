# Hugo configuration for "Bazel for Go: What Scales and What Doesn't".
#
# content/ is generated by make.go from ../README.md and ../book/*.md
# (content/en/) and from ../book/zh/ (content/zh/), and is not checked in;
# build with `make` (see Makefile). The Makefile passes
# --baseURL, so the value below is only the default. Every link the theme and
# make.go emit is relative to the baseURL (relURL / RelPermalink, or
# page-relative in the generated Markdown), so the site also works under
# `hugo server` and under any other base path.
baseURL = "https://changkun.de/bazel-for-go/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Bazel for Go"
theme = "book"

# The book has no tags or categories; do not render empty taxonomy pages.
disableKinds = ["taxonomy", "term"]

# Two editions. English stays at the site root (/bazel-for-go/04-go-command/);
# Chinese is served under /zh/ with the same chapter slugs
# (/bazel-for-go/zh/04-go-command/). make.go writes each edition's tree with
# the same paths, which is how Hugo pairs a page with its translation; the top
# bar's language switch (partials/language-switch.html) follows that pairing.
# Static files (the films, the theme's scripts) are published once, at the
# site root.
defaultContentLanguageInSubdir = false
# CJK text counts per character for .Summary and .WordCount.
hasCJKLanguage = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
  [languages.zh]
    label = "中文"
    locale = "zh-CN"
    contentDir = "content/zh"
    weight = 2
    # Merged over [params] below on the Chinese pages.
    [languages.zh.params]
      # <html lang> (partials/lang.html); English pages keep "en".
      htmlLang = "zh-CN"
      description = "一本写给资深工程师与首席工程师的短书，帮助他们判断一个 Go 代码库应当用 Bazel 构建，还是用 go 命令构建。"
      copyright = "© 2026 [欧长坤](https://changkun.de) · [MIT 许可证](https://github.com/changkun/bazel-for-go/blob/main/LICENSE)"
      menuFooter = "Bazel for Go：哪些能随规模扩展，哪些不能 © 2026 欧长坤，采用 MIT 许可证。"

# The chapters' films (../films, see films/README.md) play in the page from
# their own modules: the engine and every film are published at /films/,
# beside the MP4s that `make films` renders. make.go puts a film under its
# chapter's title. Mounting static replaces the default mount, so it is
# listed too.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../films"
    target = "static/films"
    files = ["*.js"]

[params]
  # Share/SEO description for pages without their own (part pages). The home
  # page takes the README's first paragraph (make.go), chapters their summary.
  description = "A short book for staff and principal engineers deciding whether a Go codebase should be built with Bazel or with the go command."
  # Top-bar title on narrow screens.
  shortTitle = "Bazel for Go"
  # The sidebar renders the whole home: the parts and their chapters.
  BookSection = "*"
  repo = "https://github.com/changkun/bazel-for-go"
  authorURL = "https://changkun.de"
  # Footer line and the small print under the sidebar tree (Markdown).
  copyright = "© 2026 [Changkun Ou](https://changkun.de) · [MIT License](https://github.com/changkun/bazel-for-go/blob/main/LICENSE)"
  menuFooter = "Bazel for Go: What Scales and What Doesn't © 2026 Changkun Ou. MIT License."
  # Optional 1200x630 share card under static/ (or an absolute URL). Unset,
  # link unfurls use a plain summary card.
  # shareImage = "og-cover.png"

[markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    # noClasses=false emits class-based token markup (.k/.s/.c/...) so the
    # light and dark palettes in assets/_reading.scss can both apply.
    noClasses = false
    tabWidth = 4
[markup.goldmark.renderer]
    unsafe = true
# make.go writes every link and image page-relative. A multilingual site
# otherwise turns on Hugo's embedded render hooks, which would rewrite a link
# that names a section ("part1/") into a root-relative URL.
[markup.goldmark.renderHooks.link]
    useEmbedded = "never"
[markup.goldmark.renderHooks.image]
    useEmbedded = "never"
# Goldmark's CJK extension (eastAsianLineBreaks) is deliberately off. The
# Chinese chapters are wrapped like the English ones, and make.go removes a
# line break between two Chinese characters or punctuation marks itself (see
# joinWide). The extension would change the English pages: it drops a line
# break next to code, emphasis or a link outright ("A\n*label*" renders as
# "Alabel"). Set for zh only, it replaces this whole [markup] table there; and
# in Chinese it leaves a space after a full-width comma at a line end and
# drops the space before code.
# Chapters cite sources as footnotes ([^name] in the text, definitions under a
# final "## References" heading). Goldmark renders the markers as numbered
# superscripts and appends the numbered list, with a back link per entry, at
# the end of the page, which is right under "## References". Styled in
# assets/_reading.scss (.footnotes).
[markup.goldmark.extensions.footnote]
    enable = true
    backlinkHTML = '&#x21a9;&#xfe0e;'
# Pass LaTeX math through to the HTML; render-passthrough.html renders it with
# KaTeX at build time. Single-dollar inline math is deliberately NOT enabled:
# prose such as "costs $3 ... $40" would otherwise turn into math. Use \( \)
# inline and $$ $$ or \[ \] for display math.
[markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['\(', '\)']]
