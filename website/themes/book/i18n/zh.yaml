# FlexSearch splits text at spaces, which Chinese does not have: index each
# Chinese character as a token and Latin words and numbers whole, so both
# 「缓存」 and 「Bazel」 find pages.
- id: bookSearchConfig
  translation: "{ cache: true, encode: false, tokenize: function(s) { return s.toLowerCase().match(/[\\u3400-\\u9fff\\uf900-\\ufaff]|[0-9a-z_]+/g) || []; } }"
